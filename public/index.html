<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6df0">
<meta name="description" content="Budget 2026 — personal budgeting, synced across devices.">
<title>Budget 2026</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Budget 2026<small id="fileLabel">starting…</small></div>
    <button class="nav" data-view="dashboard"><span class="ic">◧</span><span class="lb">Dashboard</span></button>
    <button class="nav" data-view="ledger"><span class="ic">≣</span><span class="lb">Ledger</span><span class="nbadge" id="badge-ledger"></span></button>
    <button class="nav" data-view="budget"><span class="ic">◎</span><span class="lb">Budget</span></button>
    <button class="nav" data-view="import"><span class="ic">↧</span><span class="lb">Import</span></button>
    <button class="nav" data-view="rules"><span class="ic">⚗</span><span class="lb">Rules</span></button>
    <button class="nav" data-view="accounts"><span class="ic">⛁</span><span class="lb">Accounts</span></button>
    <button class="nav" data-view="data"><span class="ic">◈</span><span class="lb">Data</span></button>
    <div class="foot">
      <div class="themebtn" id="themeBtns">
        <button data-theme-set="light">Light</button><button data-theme-set="dark">Dark</button><button data-theme-set="auto">Auto</button>
      </div>
      <span id="saveDot" class="dot"></span><span id="saveText">no data</span>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<!-- Supabase JS client (only needed for cloud sync; app still runs without it) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
