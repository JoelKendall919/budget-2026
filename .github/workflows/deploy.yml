name: Deploy to GitHub Pages

# Builds the static app and publishes it. The Supabase URL and anon key are
# injected here from repository secrets rather than being committed, so the
# repo stays clean and you can repoint it without a code change.
#
# Set these under: Settings -> Secrets and variables -> Actions
#   SUPABASE_URL       e.g. https://abcdefghijklm.supabase.co
#   SUPABASE_ANON_KEY  the project's anon / publishable key
#
# Then enable Pages under: Settings -> Pages -> Source: GitHub Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY not set — deploying in local-only mode."
            exit 0
          fi
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path("public/js/config.js")
          s = p.read_text(encoding="utf-8")
          s = s.replace("__SUPABASE_URL__", os.environ["SUPABASE_URL"])
          s = s.replace("__SUPABASE_ANON_KEY__", os.environ["SUPABASE_ANON_KEY"])
          p.write_text(s, encoding="utf-8")
          print("config.js updated")
          PY

      - name: Guard against committed secrets or personal data
        run: |
          python3 - <<'PY'
          import base64, json, pathlib, re, sys

          # Match key-shaped VALUES, not mentions. config.js legitimately
          # talks about secret keys in its comments and its own safety
          # check, and that must not fail the build.
          SECRET = re.compile(r"sb_secret_[A-Za-z0-9_-]{15,}")
          JWT    = re.compile(r"eyJ[A-Za-z0-9_-]{10,}\.([A-Za-z0-9_-]{10,})\.[A-Za-z0-9_-]{10,}")

          bad = []
          for f in pathlib.Path("public").rglob("*"):
              if not f.is_file():
                  continue
              try:
                  text = f.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              if SECRET.search(text):
                  bad.append(f"{f}: contains an sb_secret_ key")

              # A legacy service_role key is a JWT, so the giveaway is in the
              # decoded payload rather than the text.
              for m in JWT.finditer(text):
                  try:
                      pad = m.group(1) + "=" * (-len(m.group(1)) % 4)
                      claims = json.loads(base64.urlsafe_b64decode(pad))
                  except Exception:
                      continue
                  if claims.get("role") == "service_role":
                      bad.append(f"{f}: contains a service_role JWT")

          if pathlib.Path("public/budget-data.json").exists():
              bad.append("public/budget-data.json would publish your finances")

          for b in bad:
              print(f"::error::{b}")
          if bad:
              sys.exit("refusing to deploy")
          print("guard passed: no secret keys or personal data in public/")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
